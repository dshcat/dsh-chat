<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" id="metaTheme">
<title>DeepChat</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bgveil"></div>

<div class="app">
  <header class="topbar">
    <button class="iconbtn" id="btnMenu" aria-label="对话列表">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="titlewrap">
      <div class="title" id="chatTitle">新对话</div>
      <div class="sub" id="chatSub">准备就绪</div>
    </div>
    <button class="iconbtn" id="btnNew" aria-label="新对话">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="scroller">
    <div id="messages"></div>
    <div id="empty" class="empty">
      <div class="logo">
        <svg viewBox="0 0 48 48"><path d="M10 12h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H24l-8 7v-7h-6a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z"/><circle cx="17" cy="23" r="2.4"/><circle cx="24" cy="23" r="2.4"/><circle cx="31" cy="23" r="2.4"/></svg>
      </div>
      <h1>晚上好</h1>
      <p class="hint" id="emptyHint">先到设置里填上 API Key，然后随便聊。</p>
      <div class="suggests" id="suggests"></div>
    </div>
  </main>

  <footer class="composer">
    <div class="chips">
      <button class="chip" id="chipThink"><span class="dot"></span>深度思考</button>
      <button class="chip" id="chipSearch"><span class="dot"></span>联网</button>
      <button class="chip ghost" id="chipCost">累计 ¥0</button>
    </div>
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
      <button id="btnSend" class="sendbtn" aria-label="发送">
        <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="brand">DeepChat</div>
    <button class="iconbtn small" id="btnCloseDrawer" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="newchat" id="btnNew2">＋ 新对话</button>
  <div class="convlist" id="convlist"></div>
  <div class="drawer-foot">
    <button class="footbtn" id="btnSettings">设置 · 外观 · 提示词</button>
    <div class="ver" id="drawerVer">v2.0</div>
  </div>
</aside>

<!-- 设置 -->
<section class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="sheet-title">设置</div>
    <button class="iconbtn small" id="btnCloseSheet" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">

    <div class="group">外观</div>

    <div class="field">
      <span class="label">主题</span>
      <div class="seg" id="themeSeg">
        <button data-theme="auto">跟随系统</button>
        <button data-theme="light">浅色</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>

    <div class="field">
      <span class="label">背景</span>
      <div class="swatches" id="swatches"></div>
      <div class="btnrow">
        <label class="mini filelabel">选张图<input type="file" id="bgFile" accept="image/*"></label>
        <button class="mini" id="btnBgClear">清除背景</button>
      </div>
      <span class="note">图片会压缩后只存在本机，不会上传。</span>
    </div>

    <div class="group">模型</div>

    <label class="field">
      <span class="label">模型</span>
      <div class="selwrap">
        <select id="setModel">
          <option value="deepseek-flash">deepseek-flash · 便宜够用</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro · 更聪明更贵</option>
        </select>
      </div>
    </label>

    <div class="field rowfield">
      <div>
        <span class="label">默认深度思考</span>
        <span class="note">开：边想边答；关：快、省</span>
      </div>
      <label class="switch"><input type="checkbox" id="setThink"><i></i></label>
    </div>
    <div class="field rowfield">
      <div>
        <span class="label">默认联网</span>
        <span class="note">按次额外计费，开发时可关</span>
      </div>
      <label class="switch"><input type="checkbox" id="setSearch"><i></i></label>
    </div>

    <div class="group">提示词</div>
    <div class="field">
      <div class="presetrow" id="presetRow"></div>
      <textarea id="setSystem" rows="5" spellcheck="false" placeholder="写你想让它怎么说话…"></textarea>
      <span class="note">每轮都作为 system 发送；开头保持稳定能命中缓存，便宜 50 倍。</span>
    </div>

    <div class="group">API</div>
    <label class="field">
      <span class="label">API Key</span>
      <div class="keyrow">
        <input id="setKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
        <button class="mini" id="btnEye">显示</button>
      </div>
      <span class="note">只存在这台手机里，不会上传到任何服务器。</span>
    </label>

    <div class="group">数据</div>
    <div class="field">
      <div class="btnrow">
        <button class="danger" id="btnClear">清空所有对话</button>
      </div>
      <span class="note" id="usageNote">—</span>
    </div>

    <div class="group">关于</div>
    <div class="field about">
      <div class="aboutrow"><span>版本</span><span id="aboutVer">2.0.0</span></div>
      <div class="aboutrow"><span>协议</span><span>MIT</span></div>
      <p class="note">非官方第三方客户端，与深度求索公司无隶属关系。对话由 DeepSeek API 生成，请遵守其服务条款；API 费用由 Key 持有人自行承担。</p>
    </div>

  </div>
</section>

<!-- 编辑消息 -->
<section class="sheet" id="editSheet">
  <div class="sheet-head">
    <div class="sheet-title">编辑后重新生成</div>
    <button class="iconbtn small" id="btnEditClose" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <textarea id="editText" rows="6" spellcheck="false"></textarea>
    <div class="btnrow" style="margin-top:12px">
      <button class="primary" id="btnEditSave">保存并重新生成</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
